<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mephisto Options</title>
    <link rel="stylesheet" href="/lib/materialize/material-icons.min.css">
    <link rel="stylesheet" href="/lib/materialize/materialize.min.css">
    <!-- AFTER materialize: this sheet overrides it, and on equal specificity source order decides. -->
    <!-- The board renderer emits chessboard.js class names, so its 718 bytes of square colours
         and notation positioning come along with it. Every selector in it is one of those
         obfuscated names, so it touches nothing else on this page. -->
    <link rel="stylesheet" href="/lib/chessboard/chessboard.min.css">
    <link rel="stylesheet" href="options.css"/>
    <script src="/lib/materialize/materialize.min.js"></script>
    <script src="/src/scripts/config-store.js"></script>
    <!-- chess.js is here only so the puzzle importer can turn the daily rows' SAN into UCI;
         puzzle-db.js itself keeps no rules engine, because it also runs in the worker. -->
    <script src="/lib/chess.js"></script>
    <script src="/src/scripts/puzzle-db.js"></script>
    <!-- Self-update. Here rather than in the worker: only a page can run showDirectoryPicker(), and
         the extension's own folder is the one thing an update has to be able to write. -->
    <script src="/src/scripts/updater.js"></script>
    <!-- Game Review. panel-board.js is the panel's own board renderer (it only needs a container
         and sets `self.MephistoBoard`); review-core.js is the review's arithmetic, kept apart from
         its page so the same file can be run under node by the test ladder. -->
    <script src="/src/scripts/panel-board.js"></script>
    <script src="/src/options/pages/review/review-core.js"></script>
    <!-- the Polyglot key table: data the .bin book format cannot be read without -->
    <script src="/lib/polyglot-random.js"></script>
    <!-- the engine drivers, shared by Game Review and Analysis (self.MephistoEngines) -->
    <script src="/src/options/util/engines.js"></script>
    <script src="/src/scripts/bot-games.js"></script>
    <script src="/src/i18n/i18n.js"></script>
    <script type="module" src="framework/require.js"></script>
    <script type="module" src="options.js"></script>
</head>
<body>

<header id="header">
    <nav class="top-nav">
        <div class="container">
            <div class="nav-wrapper">
                <div class="row">
                    <div class="col s12 m12 mp-page">
                        <h1 id="title" class="header"></h1>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <ul id="nav-mobile" class="sidenav sidenav-fixed">
        <li id="logo-container">
            <a id="logo-link" href="#about" class="menu-item brand-logo">
                <img id="logo" src="../../res/mephisto_stack_lowercase.png" alt="alt" />
            </a>
        </li>
        <li class="bold"><a id="getting-started" href="#getting-started" class="menu-item waves-effect waves-pink" data-i18n="nav.getting_started">Getting Started</a></li>
        <!-- FLAT, no accordion (user call 2026-08-15): every page is one click, and a menu that
             hides two entries behind a dropdown costs more than the line of space it saves. -->
        <li class="bold"><a id="settings/general" href="#settings/general" class="menu-item waves-effect waves-pink" data-i18n="nav.settings">Settings</a></li>
        <li class="bold"><a id="settings/appearance" href="#settings/appearance" class="menu-item waves-effect waves-pink" data-i18n="nav.appearance">Appearance</a></li>
        <li class="bold"><a id="analysis" href="#analysis" class="menu-item waves-effect waves-pink" data-i18n="nav.analysis">Analysis</a></li>
        <li class="bold"><a id="review" href="#review" class="menu-item waves-effect waves-pink" data-i18n="nav.review">Game Review</a></li>
        <li class="bold"><a id="about" href="#about" class="menu-item waves-effect waves-pink" data-i18n="nav.about">About</a></li>
        <li class="bold"><a id="disclaimers" href="#disclaimers" class="menu-item waves-effect waves-pink" data-i18n="nav.disclaimers">Disclaimers</a></li>
    </ul>
</header>
<main id="content">
    <div class="container"></div>
</main>
<footer class="docs-footer">
    <div class="container">
        <div class="row">
            <div class="col s12 m12 mp-page">
                <div class="footer-copyright">
                    © 2026 Alex Petrusca
                </div>
            </div>
        </div>
    </div>
</footer>

</body>
</html>
