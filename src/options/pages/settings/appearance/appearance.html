<!-- Appearance settings. Same row/section language as General; the shared styling lives in
     general.css, which is loaded for both settings pages. -->
<div class="row">
    <div class="col s12 m8 offset-m1 xl7 offset-xl1">
        <div id="form-container" class="big-section">

            <div class="set-filter">
                <input id="settings_filter" class="browser-default" type="search" data-i18n-ph="set.filter_ph"
                       placeholder="Search these settings…" spellcheck="false" autocomplete="off">
            </div>

            <section id="board_and_pieces" class="set-sec scrollspy">
                <h3 data-i18n="set.board_and_pieces" class="set-h">Board and Pieces</h3>

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.pieces" class="tooltipped" data-position="right" data-tooltip="Which piece set the panel's own board draws with."><span data-i18n="set.pieces">Pieces:</span></span></div>
                    <div class="set-ctl">
                        <select name="pieces" id="pieces_select">
                            <option value="wikipedia.svg" data-icon="/res/chesspieces/wikipedia/wN.svg">Wikipedia</option>
                            <option value="neo.png" data-icon="/res/chesspieces/neo/wN.png">Neo</option>
                            <option value="alpha.png" data-icon="/res/chesspieces/alpha/wN.png">Alpha</option>
                            <option value="classic.png" data-icon="/res/chesspieces/classic/wN.png">Classic</option>
                            <option value="vintage.png" data-icon="/res/chesspieces/vintage/wN.png">Vintage</option>
                            <option value="book.png" data-icon="/res/chesspieces/book/wN.png">Book</option>
                            <option value="bases.png" data-icon="/res/chesspieces/bases/wN.png">Bases</option>
                            <option value="staunty.svg" data-icon="/res/chesspieces/staunty/wN.svg">Staunty</option>
                            <option value="riohacha.svg" data-icon="/res/chesspieces/riohacha/wN.svg">Riohacha</option>
                            <option value="newspaper.png" data-icon="/res/chesspieces/newspaper/wN.png">Newspaper</option>
                            <option value="wood.png" data-icon="/res/chesspieces/wood/wN.png">Wood</option>
                            <option value="neo-wood.png" data-icon="/res/chesspieces/neo-wood/wN.png">Neo-Wood</option>
                            <option value="8-bit.png" data-icon="/res/chesspieces/8-bit/wN.png">8-Bit</option>
                            <option value="three-dee.png" data-icon="/res/chesspieces/three-dee/wN.png">Three-Dee</option>
                        </select>
                    </div>
                </div>

                

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.board" class="tooltipped" data-position="right" data-tooltip="Which board colours the panel's own board uses."><span data-i18n="set.board">Board:</span></span></div>
                    <div class="set-ctl">
                        <select name="board" id="board_select">
                            <option value="brown" data-icon="/res/chessboards/previews/brown.png">Brown</option>
                            <option value="red" data-icon="/res/chessboards/previews/red.png">Red</option>
                            <option value="orange" data-icon="/res/chessboards/previews/orange.png">Orange</option>
                            <option value="tan" data-icon="/res/chessboards/previews/tan.png">Tan</option>
                            <option value="green" data-icon="/res/chessboards/previews/green.png">Green</option>
                            <option value="sky" data-icon="/res/chessboards/previews/sky.png">Sky</option>
                            <option value="blue" data-icon="/res/chessboards/previews/blue.png">Blue</option>
                            <option value="purple" data-icon="/res/chessboards/previews/purple.png">Purple</option>
                            <option value="grey" data-icon="/res/chessboards/previews/grey.png">Grey</option>
                            <option value="wood" data-icon="/res/chessboards/previews/wood.png">Wood</option>
                            <option value="marble" data-icon="/res/chessboards/previews/marble.png">Marble</option>
                            <option value="newspaper" data-icon="/res/chessboards/previews/newspaper.png">Newspaper</option>
                            <option value="_8-bit" data-icon="/res/chessboards/previews/8-bit.png">8-Bit</option>
                        </select>
                    </div>
                </div>

                <div class="set-row set-toggle">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.coordinates" class="tooltipped" data-position="right" data-tooltip="Show file letters and rank numbers on the panel's board."><span data-i18n="set.coordinates">Coordinates:</span></span></div>
                    <div class="set-ctl">
                        <input id="coordinates_checkbox" type="checkbox" class="set-cb">
                        <label for="coordinates_checkbox" class="set-tgl">
                            <span data-i18n="ui.on" class="set-on">On</span><span data-i18n="ui.off" class="set-off">Off</span>
                        </label>
                    </div>
                </div>

                <div class="set-row set-toggle">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.dark_mode" class="tooltipped" data-position="right" data-tooltip="Dark colours for the settings pages and the panel."><span data-i18n="set.dark_mode">Dark Mode:</span></span></div>
                    <div class="set-ctl">
                        <input id="dark_mode_checkbox" type="checkbox" class="set-cb">
                        <label for="dark_mode_checkbox" class="set-tgl">
                            <span data-i18n="ui.on" class="set-on">On</span><span data-i18n="ui.off" class="set-off">Off</span>
                        </label>
                    </div>
                </div>
            </section>

            <section id="arrow_colours" class="set-sec scrollspy">
                <h3 data-i18n="set.arrow_colours" class="set-h">Arrow colours</h3>

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.board" class="tooltipped" data-position="right" data-tooltip="Which board colours the panel's own board uses."><span data-i18n="set.arrow_color_line1">Line 1 Arrow</span></span></div>
                    <div class="set-ctl">
                        <span class="set-color">
                            <input id="arrow_color_line1_picker" type="color" value="#0a5bd3" class="set-color-swatch">
                            <input id="arrow_color_line1_input" type="text" placeholder="#0a5bd3" maxlength="7" class="set-color-hex">
                        </span>
                    </div>
                </div>

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.coordinates" class="tooltipped" data-position="right" data-tooltip="Show file letters and rank numbers on the panel's board."><span data-i18n="set.arrow_color_line2">Line 2 Arrow</span></span></div>
                    <div class="set-ctl">
                        <span class="set-color">
                            <input id="arrow_color_line2_picker" type="color" value="#0f9d58" class="set-color-swatch">
                            <input id="arrow_color_line2_input" type="text" placeholder="#0f9d58" maxlength="7" class="set-color-hex">
                        </span>
                    </div>
                </div>

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.dark_mode" class="tooltipped" data-position="right" data-tooltip="Dark colours for the settings pages and the panel."><span data-i18n="set.arrow_color_line3">Line 3 Arrow</span></span></div>
                    <div class="set-ctl">
                        <span class="set-color">
                            <input id="arrow_color_line3_picker" type="color" value="#e0a400" class="set-color-swatch">
                            <input id="arrow_color_line3_input" type="text" placeholder="#e0a400" maxlength="7" class="set-color-hex">
                        </span>
                    </div>
                </div>

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.arrow_color_line4" class="tooltipped" data-position="right" data-tooltip="Colour of the arrow for the fourth line."><span data-i18n="set.arrow_color_line4">Line 4 Arrow</span></span></div>
                    <div class="set-ctl">
                        <span class="set-color">
                            <input id="arrow_color_line4_picker" type="color" value="#e8710a" class="set-color-swatch">
                            <input id="arrow_color_line4_input" type="text" placeholder="#e8710a" maxlength="7" class="set-color-hex">
                        </span>
                    </div>
                </div>

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.arrow_color_line5" class="tooltipped" data-position="right" data-tooltip="Colour of the arrow for the fifth line and any beyond it."><span data-i18n="set.arrow_color_line5">Line 5 Arrow</span></span></div>
                    <div class="set-ctl">
                        <span class="set-color">
                            <input id="arrow_color_line5_picker" type="color" value="#9333ea" class="set-color-swatch">
                            <input id="arrow_color_line5_input" type="text" placeholder="#9333ea" maxlength="7" class="set-color-hex">
                        </span>
                    </div>
                </div>

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.arrow_color_forced_ours" class="tooltipped" data-position="right" data-tooltip="Colour of your own moves in a forced continuation."><span data-i18n="set.arrow_color_forced_ours">Forced Line (Yours)</span></span></div>
                    <div class="set-ctl">
                        <span class="set-color">
                            <input id="arrow_color_forced_ours_picker" type="color" value="#d81b8c" class="set-color-swatch">
                            <input id="arrow_color_forced_ours_input" type="text" placeholder="#d81b8c" maxlength="7" class="set-color-hex">
                        </span>
                    </div>
                </div>

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.arrow_color_forced_theirs" class="tooltipped" data-position="right" data-tooltip="Colour of the opponent's forced replies in a forced continuation."><span data-i18n="set.arrow_color_forced_theirs">Forced Line (Theirs)</span></span></div>
                    <div class="set-ctl">
                        <span class="set-color">
                            <input id="arrow_color_forced_theirs_picker" type="color" value="#00a693" class="set-color-swatch">
                            <input id="arrow_color_forced_theirs_input" type="text" placeholder="#00a693" maxlength="7" class="set-color-hex">
                        </span>
                    </div>
                </div>

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.arrow_color_pv_walk" class="tooltipped" data-position="right" data-tooltip="Colour of the numbered PV Arrows that draw the whole line ahead."><span data-i18n="set.arrow_color_pv_walk">PV Arrows</span></span></div>
                    <div class="set-ctl">
                        <span class="set-color">
                            <input id="arrow_color_pv_walk_picker" type="color" value="#8f8f8f" class="set-color-swatch">
                            <input id="arrow_color_pv_walk_input" type="text" placeholder="#8f8f8f" maxlength="7" class="set-color-hex">
                        </span>
                    </div>
                </div>

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.arrow_color_threat" class="tooltipped" data-position="right" data-tooltip="Colour of the arrow showing what the opponent threatens."><span data-i18n="set.arrow_color_threat">Threat Arrow</span></span></div>
                    <div class="set-ctl">
                        <span class="set-color">
                            <input id="arrow_color_threat_picker" type="color" value="#bf0000" class="set-color-swatch">
                            <input id="arrow_color_threat_input" type="text" placeholder="#bf0000" maxlength="7" class="set-color-hex">
                        </span>
                    </div>
                </div>

                <div class="set-row">
                    <div class="set-lbl"><span data-i18n-tip="set.tip.arrow_color_book" class="tooltipped" data-position="right" data-tooltip="Colour of the arrows for opening-book moves."><span data-i18n="set.arrow_color_book">Book Arrows</span></span></div>
                    <div class="set-ctl">
                        <span class="set-color">
                            <input id="arrow_color_book_picker" type="color" value="#14b8a6" class="set-color-swatch">
                            <input id="arrow_color_book_input" type="text" placeholder="#14b8a6" maxlength="7" class="set-color-hex">
                        </span>
                    </div>
                </div>

            </section>

            <section id="language" class="set-sec scrollspy">
                <h3 data-i18n="set.language" class="set-h">Language</h3>
                <div class="set-row">
                    <div class="set-lbl">
                        <span data-i18n-tip="set.tip.language" class="tooltipped" data-position="right"
                              data-tooltip="The language of the panel and these settings. Engine names, board themes and chess notation stay as they are.">
                            <span data-i18n="set.language">Language</span> <i class="material-icons info-tooltip">info</i>
                        </span>
                    </div>
                    <div class="set-ctl">
                        <select name="language" id="language_select"></select>
                    </div>
                </div>
            </section>

            <div class="set-btnrow set-btnrow-end">
                <button data-i18n="set.restore_defaults" id="reset_btn" type="button" class="set-btn">Restore Defaults</button>
            </div>
        </div>
    </div>
    <div class="col hide-on-small-only m2 xl3 sticky-top">
        <div class="toc-wrapper pin-top">
            <ul id="toc" class="section table-of-contents">
                <li><a data-i18n="set.board_and_pieces" href="#board_and_pieces">Board and Pieces</a></li>
                <li><a data-i18n="set.arrow_colours" href="#arrow_colours">Arrow colours</a></li>
                <li><a data-i18n="set.language" href="#language">Language</a></li>
            </ul>
        </div>
    </div>
</div>
